spring.application.name=job-hunter-api

#Server Port
server.port=8080

#PostgreSQL Database Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jobhunterdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: Automatically updates database schema tables based on Java @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Show formatted SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true




